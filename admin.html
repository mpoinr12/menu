<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم الأدمن - لحمة وفحمة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #0f1218; color: #f3f4f6; }
  </style>
</head>
<body class="min-h-screen">

  <!-- شاشة تسجيل الدخول -->
  <div id="loginScreen" class="flex items-center justify-center min-h-screen px-4">
    <div class="bg-[#161a24] p-8 rounded-2xl shadow-2xl border border-gray-800 w-full max-w-md">
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-brand-500/20 text-brand-500 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h2 class="text-2xl font-bold text-white">تسجيل دخول الأدمن</h2>
        <p class="text-gray-400 text-sm mt-1">مطعم لحمة وفحمة</p>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-bold text-gray-300 mb-1">البريد الإلكتروني</label>
          <input type="email" id="loginEmail" class="w-full bg-[#0b0d13] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500" placeholder="admin@lahma.com">
        </div>
        <div>
          <label class="block text-sm font-bold text-gray-300 mb-1">كلمة المرور</label>
          <input type="password" id="loginPassword" class="w-full bg-[#0b0d13] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500" placeholder="••••••••">
        </div>
        <button id="btnLogin" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 px-4 rounded-xl transition-colors mt-2">
          دخول
        </button>
        <p id="loginError" class="text-red-500 text-sm text-center hidden mt-2"></p>
      </div>
    </div>
  </div>

  <!-- لوحة التحكم (مخفية حتى يتم تسجيل الدخول) -->
  <div id="dashboardScreen" class="hidden">
    <nav class="bg-[#161a24] border-b border-gray-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-gear text-orange-500 text-xl"></i>
        <h1 class="text-xl font-bold text-white">لوحة الإدارة</h1>
      </div>
      <button id="btnLogout" class="bg-red-500/10 hover:bg-red-500/20 text-red-500 border border-red-500/30 px-4 py-2 rounded-lg text-sm font-bold transition-all">
        <i class="fa-solid fa-arrow-right-from-bracket ml-1"></i> تسجيل الخروج
      </button>
    </nav>

    <div class="max-w-5xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- العمود الجانبي: إدارة الأقسام -->
      <div class="md:col-span-1 space-y-6">
        <div class="bg-[#161a24] p-5 rounded-2xl border border-gray-800">
          <h2 class="text-lg font-bold text-white mb-4 border-b border-gray-700 pb-2"><i class="fa-solid fa-layer-group text-orange-500 ml-1"></i> إدارة الأقسام</h2>
          
          <div class="space-y-3 mb-5">
            <input type="text" id="catId" placeholder="المعرف (مثال: drinks)" class="w-full bg-[#0b0d13] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
            <input type="text" id="catNameAr" placeholder="الاسم بالعربي (مشروبات)" class="w-full bg-[#0b0d13] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
            <input type="text" id="catNameEn" placeholder="الاسم بالإنجليزي (Drinks)" class="w-full bg-[#0b0d13] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
            <input type="text" id="catEmoji" placeholder="إيموجي القسم (🥤)" class="w-full bg-[#0b0d13] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
            <button id="btnAddCategory" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg text-sm transition-colors">إضافة قسم جديد</button>
          </div>

          <div id="categoriesList" class="space-y-2 max-h-60 overflow-y-auto">
            <div class="text-center text-sm text-gray-500">جاري تحميل الأقسام...</div>
          </div>
        </div>
      </div>

      <!-- العمود الرئيسي: إضافة الوجبات -->
      <div class="md:col-span-2">
        <div class="bg-[#161a24] p-6 rounded-2xl border border-gray-800">
          <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-3">
            <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-plus text-orange-500 ml-2"></i> إضافة وجبة جديدة</h2>
            <button id="btnAutoTranslate" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-1.5 rounded-lg text-sm font-bold transition-all"><i class="fa-solid fa-language ml-1"></i> ترجمة تلقائية للإنجليزية</button>
          </div>
          
          <form id="addMenuForm" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-bold text-gray-300 mb-1">اسم الوجبة (عربي)</label>
                <input type="text" id="name" required class="w-full bg-[#0b0d13] border border-gray-700 rounded-xl px-4 py-2.5 text-white">
              </div>
              <div>
                <label class="block text-sm font-bold text-gray-300 mb-1">اسم الوجبة (إنجليزي)</label>
                <input type="text" id="subtitle" required class="w-full bg-[#0b0d13] border border-gray-700 rounded-xl px-4 py-2.5 text-white">
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-bold text-gray-300 mb-1">القسم</label>
                <select id="category" required class="w-full bg-[#0b0d13] border border-gray-700 rounded-xl px-4 py-2.5 text-white appearance-none">
                  <option value="">جاري تحميل الأقسام...</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-bold text-gray-300 mb-1">السعر (ل.س)</label>
                <input type="number" id="price" required class="w-full bg-[#0b0d13] border border-gray-700 rounded-xl px-4 py-2.5 text-white">
              </div>
            </div>

            <div>
              <label class="block text-sm font-bold text-gray-300 mb-1">رابط الصورة (WebP)</label>
              <input type="text" id="image" required class="w-full bg-[#0b0d13] border border-gray-700 rounded-xl px-4 py-2.5 text-white" placeholder="burger.webp">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-bold text-gray-300 mb-1">الوصف (عربي)</label>
                <textarea id="description" rows="2" class="w-full bg-[#0b0d13] border border-gray-700 rounded-xl px-4 py-2 text-white"></textarea>
              </div>
              <div>
                <label class="block text-sm font-bold text-gray-300 mb-1">الوصف (إنجليزي)</label>
                <textarea id="descriptionEn" rows="2" class="w-full bg-[#0b0d13] border border-gray-700 rounded-xl px-4 py-2 text-white"></textarea>
              </div>
            </div>

            <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg mt-4 text-lg">
              <i class="fa-solid fa-cloud-arrow-up ml-2"></i> رفع الوجبة للقائمة
            </button>
          </form>
          <div id="statusMsg" class="mt-4 text-center font-bold text-sm"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // 1. استيراد المكتبات الأساسية
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    // 2. إعدادات Firebase الخاصة بك
    const firebaseConfig = {
      apiKey: "AIzaSyBcR06wtdVs0nI3Gmi0Keb8Q9EdXTOEgf0",
      authDomain: "lahma-menu.firebaseapp.com",
      projectId: "lahma-menu",
      storageBucket: "lahma-menu.firebasestorage.app",
      messagingSenderId: "642565994237",
      appId: "1:642565994237:web:2fff0a3fe0741460f67094"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    // واجهة المستخدم
    const loginScreen = document.getElementById('loginScreen');
    const dashboardScreen = document.getElementById('dashboardScreen');

    // 3. مراقبة حالة تسجيل الدخول
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // إذا كان مسجل دخول، اعرض لوحة التحكم وحمل الأقسام
        loginScreen.classList.add('hidden');
        dashboardScreen.classList.remove('hidden');
        loadCategories();
      } else {
        // إذا لم يكن مسجل دخول، اعرض شاشة تسجيل الدخول
        loginScreen.classList.remove('hidden');
        dashboardScreen.classList.add('hidden');
      }
    });

    // 4. برمجة زر تسجيل الدخول
    document.getElementById('btnLogin').addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorMsg = document.getElementById('loginError');
      
      try {
        await signInWithEmailAndPassword(auth, email, password);
        errorMsg.classList.add('hidden');
      } catch (error) {
        errorMsg.textContent = "بيانات الدخول غير صحيحة!";
        errorMsg.classList.remove('hidden');
      }
    });

    // 5. برمجة زر تسجيل الخروج
    document.getElementById('btnLogout').addEventListener('click', () => {
      signOut(auth);
    });

    // 6. إدارة الأقسام (جلب البيانات وعرضها في القائمة الجانبية وقائمة اختيار الوجبات)
    async function loadCategories() {
      const catList = document.getElementById('categoriesList');
      const catSelect = document.getElementById('category');
      
      try {
        const querySnapshot = await getDocs(collection(db, "categories"));
        catList.innerHTML = '';
        catSelect.innerHTML = '<option value="">اختر القسم...</option>';
        
        querySnapshot.forEach((docSnap) => {
          const cat = docSnap.data();
          
          // إضافتها لقائمة الحذف
          catList.innerHTML += `
            <div class="flex justify-between items-center bg-[#1f2430] p-2.5 rounded-lg border border-gray-700">
              <div class="text-sm font-bold text-gray-200">${cat.emoji} ${cat.nameAr}</div>
              <button onclick="deleteCategory('${docSnap.id}')" class="text-red-400 hover:text-red-300 text-xs bg-red-500/10 px-2 py-1 rounded">حذف</button>
            </div>
          `;
          
          // إضافتها للقائمة المنسدلة في نموذج الوجبة
          catSelect.innerHTML += `<option value="${cat.id}">${cat.emoji} ${cat.nameAr} - ${cat.nameEn}</option>`;
        });

        if(querySnapshot.empty) {
            catList.innerHTML = '<div class="text-xs text-gray-500 text-center">لا توجد أقسام، أضف قسماً جديداً.</div>';
        }
      } catch (error) {
        console.error("Error loading categories: ", error);
      }
    }

    // 7. إضافة قسم جديد
    document.getElementById('btnAddCategory').addEventListener('click', async () => {
      const id = document.getElementById('catId').value;
      const nameAr = document.getElementById('catNameAr').value;
      const nameEn = document.getElementById('catNameEn').value;
      const emoji = document.getElementById('catEmoji').value;

      if(!id || !nameAr || !nameEn) return alert('يرجى تعبئة بيانات القسم الأساسية');

      try {
        await addDoc(collection(db, "categories"), {
          id: id,
          nameAr: nameAr,
          nameEn: nameEn,
          emoji: emoji
        });
        
        // تفريغ الحقول وتحديث القائمة
        document.getElementById('catId').value = '';
        document.getElementById('catNameAr').value = '';
        document.getElementById('catNameEn').value = '';
        document.getElementById('catEmoji').value = '';
        loadCategories();
      } catch (error) {
        alert('حدث خطأ أثناء الإضافة');
      }
    });

    // 8. حذف قسم (يجب تعريفها على window لتصلها أزرار HTML)
    window.deleteCategory = async function(docId) {
      if(confirm('هل أنت متأكد من حذف هذا القسم؟')) {
        await deleteDoc(doc(db, "categories", docId));
        loadCategories();
      }
    };

    // 9. إضافة الوجبة (باستخدام القسم الديناميكي)
    document.getElementById('addMenuForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const statusMsg = document.getElementById('statusMsg');
      statusMsg.textContent = "جاري الرفع... ⏳";
      statusMsg.className = "mt-4 text-center font-bold text-sm text-yellow-500";

      const newItem = {
        name: document.getElementById('name').value,
        subtitle: document.getElementById('subtitle').value,
        category: document.getElementById('category').value,
        price: document.getElementById('price').value,
        image: document.getElementById('image').value,
        description: document.getElementById('description').value,
        descriptionEn: document.getElementById('descriptionEn').value,
        tags: [], tagsEn: [], allergens: [], isVisible: true
      };

      try {
        await addDoc(collection(db, "menu"), newItem);
        statusMsg.textContent = "✅ تم إضافة الوجبة بنجاح!";
        statusMsg.className = "mt-4 text-center font-bold text-sm text-green-500";
        document.getElementById('addMenuForm').reset();
      } catch (error) {
        console.error(error);
        statusMsg.textContent = "❌ حدث خطأ، تأكد من الصلاحيات والاتصال";
        statusMsg.className = "mt-4 text-center font-bold text-sm text-red-500";
      }
    });

    // 10. دالة الترجمة التلقائية
    document.getElementById('btnAutoTranslate').addEventListener('click', async () => {
      const nameAr = document.getElementById('name').value;
      const descAr = document.getElementById('description').value;

      if (!nameAr && !descAr) return alert("يرجى كتابة الاسم أو الوصف بالعربي أولاً!");

      document.getElementById('btnAutoTranslate').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الترجمة...';

      try {
        if (nameAr) {
          const resName = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(nameAr)}&langpair=ar|en`);
          const dataName = await resName.json();
          document.getElementById('subtitle').value = dataName.responseData.translatedText;
        }
        if (descAr) {
          const resDesc = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(descAr)}&langpair=ar|en`);
          const dataDesc = await resDesc.json();
          document.getElementById('descriptionEn').value = dataDesc.responseData.translatedText;
        }
      } catch (err) {
        alert("حدث خطأ في خدمة الترجمة.");
      }
      document.getElementById('btnAutoTranslate').innerHTML = '<i class="fa-solid fa-language ml-1"></i> ترجمة تلقائية للإنجليزية';
    });
  </script>
</body>
</html>
