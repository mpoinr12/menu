<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة مطعم لحمة وفحمة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>body { font-family: 'Cairo', sans-serif; background-color: #0f1218; color: white; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- شاشة تسجيل الدخول -->
  <div id="loginScreen" class="w-full max-w-md bg-[#161a24] p-8 rounded-2xl border border-gray-800 shadow-2xl">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-black text-white">لوحة الإدارة</h1>
      <p class="text-sm text-gray-400 mt-1">مطعم لحمة وفحمة</p>
    </div>
    <div class="space-y-4">
      <div>
        <label class="block text-xs text-gray-400 mb-1">البريد الإلكتروني</label>
        <input type="email" id="email" class="w-full bg-[#0f1218] border border-gray-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-orange-500" placeholder="admin@lahma.com">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">كلمة المرور</label>
        <input type="password" id="password" class="w-full bg-[#0f1218] border border-gray-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-orange-500" placeholder="••••••••">
      </div>
      <button onclick="login()" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-2.5 rounded-xl transition-all">
        تسجيل الدخول
      </button>
      <p id="errorMsg" class="text-red-500 text-xs text-center hidden"></p>
    </div>
  </div>

  <!-- لوحة التحكم الرئيسية -->
  <div id="dashboardScreen" class="w-full max-w-5xl bg-[#161a24] p-6 rounded-2xl border border-gray-800 shadow-2xl hidden h-[95vh] flex flex-col">
    <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-700">
      <div class="flex items-center gap-4">
        <h2 class="text-xl font-black text-white">إدارة قائمة الطعام الشاملة</h2>
        <button type="button" onclick="autoTranslateNew()" class="bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white border border-blue-500/40 px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5">
          <i class="fa-solid fa-language"></i> ترجمة البيانات العربية تلقائياً 🌐
        </button>
      </div>
      <button onclick="logout()" class="bg-red-500/20 text-red-500 hover:bg-red-500 hover:text-white px-4 py-2 rounded-xl text-xs font-bold transition-all">تسجيل الخروج</button>
    </div>

    <!-- فورم إضافة وجبة -->
    <div class="bg-[#0f1218] p-5 rounded-xl border border-gray-800 mb-6 grid grid-cols-1 md:grid-cols-3 gap-4 items-end overflow-y-auto max-h-[60vh]">
      <div>
        <label class="block text-[10px] text-gray-400 mb-1">اسم الوجبة (عربي) *</label>
        <input type="text" id="newName" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="مثال: شاورما عربي دبل">
      </div>
      <div>
        <label class="block text-[10px] text-gray-400 mb-1">الاسم الإنجليزي (Subtitle)</label>
        <input type="text" id="newSubtitle" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="Double Arabic Shawarma">
      </div>
      <div>
        <label class="block text-[10px] text-gray-400 mb-1">السعر *</label>
        <input type="text" id="newPrice" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="350">
      </div>
      <div>
        <label class="block text-[10px] text-gray-400 mb-1">القسم</label>
        <select id="newCategory" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
          <option value="sandwich">سندويش</option>
          <option value="burger">برجر</option>
        </select>
      </div>
      <div>
        <label class="block text-[10px] text-gray-400 mb-1">الشعار (Badge)</label>
        <input type="text" id="newBadge" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="الأكثر مبيعاً 🔥">
      </div>
      <div>
        <label class="block text-[10px] text-gray-400 mb-1">السعرات الحرارية</label>
        <input type="text" id="newCalories" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="650 سعرة">
      </div>
      <div class="md:col-span-2">
        <label class="block text-[10px] text-gray-400 mb-1">الوصف (عربي)</label>
        <input type="text" id="newDescription" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="وصف الوجبة المختصر...">
      </div>
      <div>
        <label class="block text-[10px] text-gray-400 mb-1">الوصف بالإنجليزية (Description EN)</label>
        <input type="text" id="newDescriptionEn" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="English description">
      </div>
      <div class="md:col-span-2">
        <label class="block text-[10px] text-gray-400 mb-1">المكونات (عربي)</label>
        <input type="text" id="newIngredients" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="صدور دجاج، كريم الثوم...">
      </div>
      <div>
        <label class="block text-[10px] text-gray-400 mb-1">المكونات بالإنجليزية (Ingredients EN)</label>
        <input type="text" id="newIngredientsEn" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="Chicken breasts, garlic sauce...">
      </div>
      <div class="md:col-span-2">
        <label class="block text-[10px] text-gray-400 mb-1">الوسوم (مفصولة بفاصلة ,)</label>
        <input type="text" id="newTags" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="شاورما, دجاج">
      </div>
      
      <!-- مسببات الحساسية -->
      <div class="md:col-span-3 bg-[#161a24] p-3 rounded-lg border border-gray-800">
        <label class="block text-xs text-orange-400 font-bold mb-2">اختر مسببات الحساسية إن وجدت:</label>
        <div class="flex flex-wrap gap-4 text-xs text-gray-300">
          <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="newAllergen" value="البيض 🥚" class="accent-orange-600"> البيض 🥚</label>
          <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="newAllergen" value="الألبان 🥛" class="accent-orange-600"> الألبان 🥛</label>
          <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="newAllergen" value="الغلوتين 🌾" class="accent-orange-600"> الغلوتين (خبز) 🌾</label>
          <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="newAllergen" value="السمسم 🫘" class="accent-orange-600"> السمسم 🫘</label>
          <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="newAllergen" value="المكسرات 🥜" class="accent-orange-600"> المكسرات 🥜</label>
        </div>
      </div>

      <div class="md:col-span-3">
        <label class="block text-[10px] text-gray-400 mb-1">صورة الوجبة</label>
        <input type="file" id="newImageFile" accept="image/*" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white file:mr-4 file:py-1 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-orange-600 file:text-white cursor-pointer">
      </div>
      <div class="md:col-span-3 flex justify-end mt-2">
        <button id="submitBtn" onclick="addItem()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-8 rounded-lg text-sm transition-all shadow-lg">
          إضافة الوجبة للقائمة
        </button>
      </div>
    </div>

    <!-- جدول الوجبات -->
    <div class="flex-1 overflow-auto rounded-xl border border-gray-800">
      <table class="w-full text-right text-sm">
        <thead class="bg-[#0f1218] text-gray-400 text-xs uppercase sticky top-0 z-10">
          <tr>
            <th class="px-4 py-4">الوجبة</th>
            <th class="px-4 py-4">القسم</th>
            <th class="px-4 py-4">السعر</th>
            <th class="px-4 py-4 text-center">الحالة</th>
            <th class="px-4 py-4 text-left">إجراءات</th>
          </tr>
        </thead>
        <tbody id="menuTable" class="divide-y divide-gray-800">
        </tbody>
      </table>
    </div>
  </div>

  <!-- نافذة التعديل -->
  <div id="editModal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-[#161a24] border border-gray-700 rounded-2xl w-full max-w-xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-3">
        <h3 class="text-xl font-bold text-white">تعديل الوجبة</h3>
        <button type="button" onclick="autoTranslateEdit()" class="bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white border border-blue-500/40 px-3 py-1 rounded-lg text-xs font-bold transition-all">
          ترجمة تلقائية 🌐
        </button>
      </div>
      <div class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-xs text-gray-400 mb-1">اسم الوجبة (عربي)</label><input type="text" id="editName" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
          <div><label class="block text-xs text-gray-400 mb-1">الاسم الإنجليزي (Subtitle)</label><input type="text" id="editSubtitle" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
        </div>
        <div class="grid grid-cols-3 gap-3">
          <div><label class="block text-xs text-gray-400 mb-1">السعر</label><input type="text" id="editPrice" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
          <div><label class="block text-xs text-gray-400 mb-1">الشعار (Badge)</label><input type="text" id="editBadge" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
          <div><label class="block text-xs text-gray-400 mb-1">السعرات</label><input type="text" id="editCalories" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-xs text-gray-400 mb-1">الوصف (عربي)</label><input type="text" id="editDescription" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
          <div><label class="block text-xs text-gray-400 mb-1">الوصف (EN)</label><input type="text" id="editDescriptionEn" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-xs text-gray-400 mb-1">المكونات (عربي)</label><input type="text" id="editIngredients" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
          <div><label class="block text-xs text-gray-400 mb-1">المكونات (EN)</label><input type="text" id="editIngredientsEn" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
        </div>
        <div><label class="block text-xs text-gray-400 mb-1">الوسوم (مفصولة بفاصلة)</label><input type="text" id="editTags" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
        
        <div class="bg-[#0f1218] p-3 rounded-lg border border-gray-800">
          <label class="block text-xs text-orange-400 font-bold mb-2">مسببات الحساسية:</label>
          <div class="flex flex-wrap gap-4 text-xs text-gray-300">
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="editAllergen" value="البيض 🥚" class="accent-orange-600"> البيض 🥚</label>
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="editAllergen" value="الألبان 🥛" class="accent-orange-600"> الألبان 🥛</label>
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="editAllergen" value="الغلوتين 🌾" class="accent-orange-600"> الغلوتين (خبز) 🌾</label>
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="editAllergen" value="السمسم 🫘" class="accent-orange-600"> السمسم 🫘</label>
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="editAllergen" value="المكسرات 🥜" class="accent-orange-600"> المكسرات 🥜</label>
          </div>
        </div>

        <div><label class="block text-xs text-gray-400 mb-1">تغيير الصورة</label><input type="file" id="editImageFile" accept="image/*" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white"></div>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button onclick="closeEditModal()" class="px-4 py-2 rounded-lg text-sm text-gray-400 hover:bg-gray-800">إلغاء</button>
        <button id="saveEditBtn" onclick="saveEdit()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg text-sm font-bold">حفظ</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcR06wtdVs0nI3Gmi0Keb8Q9EdXTOEgf0",
      authDomain: "lahma-menu.firebaseapp.com",
      projectId: "lahma-menu",
      storageBucket: "lahma-menu.firebasestorage.app",
      messagingSenderId: "642565994237",
      appId: "1:642565994237:web:2fff0a3fe0741460f67094",
      measurementId: "G-MZ4G6DD20L"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.menuData = {};
    window.currentEditId = null;

    // دالة الترجمة التلقائية المجانية البرمجية
    async function translateText(text) {
      if (!text) return '';
      try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ar|en`);
        const data = await res.json();
        if (data && data.responseData && data.responseData.translatedText) {
          return data.responseData.translatedText;
        }
      } catch (e) {
        console.error("Translation error", e);
      }
      return text;
    }

    window.autoTranslateNew = async function() {
      const name = document.getElementById('newName').value;
      const desc = document.getElementById('newDescription').value;
      const ing = document.getElementById('newIngredients').value;

      if(!name && !desc && !ing) return alert('الرجاء كتابة بعض الحقول بالعربي أولاً لترجمتها!');

      event.target.textContent = 'جاري الترجمة... ⏳';
      if(name) document.getElementById('newSubtitle').value = await translateText(name);
      if(desc) document.getElementById('newDescriptionEn').value = await translateText(desc);
      if(ing) document.getElementById('newIngredientsEn').value = await translateText(ing);
      event.target.textContent = 'ترجمة البيانات العربية تلقائياً 🌐';
    };

    window.autoTranslateEdit = async function() {
      const name = document.getElementById('editName').value;
      const desc = document.getElementById('editDescription').value;
      const ing = document.getElementById('editIngredients').value;

      event.target.textContent = 'جاري الترجمة...';
      if(name) document.getElementById('editSubtitle').value = await translateText(name);
      if(desc) document.getElementById('editDescriptionEn').value = await translateText(desc);
      if(ing) document.getElementById('editIngredientsEn').value = await translateText(ing);
      event.target.textContent = 'ترجمة تلقائية 🌐';
    };

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('hidden');
        loadItems();
      } else {
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('dashboardScreen').classList.add('hidden');
      }
    });

    window.login = () => {
      const e = document.getElementById('email').value;
      const p = document.getElementById('password').value;
      signInWithEmailAndPassword(auth, e, p).catch(() => alert('تأكد من البيانات'));
    };

    window.logout = () => signOut(auth);

    function processImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > h && w > 400) { h *= 400 / w; w = 400; } else if (h > 400) { w *= 400 / h; h = 400; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
        };
      });
    }

    async function loadItems() {
      const table = document.getElementById('menuTable');
      const snapshot = await getDocs(collection(db, "menu"));
      table.innerHTML = '';
      window.menuData = {};
      
      if(snapshot.empty) {
        table.innerHTML = '<tr><td colspan="5" class="text-center py-6 text-gray-500">القائمة فارغة</td></tr>';
        return;
      }

      snapshot.forEach(docSnap => {
        const item = docSnap.data();
        const id = docSnap.id;
        window.menuData[id] = item;
        const isVisible = item.isVisible !== false;

        table.innerHTML += `
          <tr class="hover:bg-[#1a1f2b] ${!isVisible ? 'opacity-50' : ''}">
            <td class="px-4 py-3 font-bold">${item.name}</td>
            <td class="px-4 py-3 text-xs text-gray-400">${item.category === 'sandwich' ? 'سندويش' : 'برجر'}</td>
            <td class="px-4 py-3 text-orange-500 font-bold">${item.price} ل.س</td>
            <td class="px-4 py-3 text-center">
              <button onclick="toggleVisibility('${id}', ${isVisible})" class="px-2 py-1 rounded text-xs ${isVisible ? 'bg-green-500/20 text-green-400' : 'bg-gray-700 text-gray-300'}">
                ${isVisible ? '👁️ ظاهر' : '❌ مخفي'}
              </button>
            </td>
            <td class="px-4 py-3 text-left space-x-2">
              <button onclick="openEditModal('${id}')" class="text-blue-400 text-xs border border-blue-500/30 px-2.5 py-1 rounded">تعديل</button>
              <button onclick="deleteItem('${id}')" class="text-red-400 text-xs border border-red-500/30 px-2.5 py-1 rounded">حذف</button>
            </td>
          </tr>
        `;
      });
    }

    window.addItem = async () => {
      const name = document.getElementById('newName').value;
      const price = document.getElementById('newPrice').value;
      if(!name || !price) return alert('الاسم والسعر مطلوبان!');

      const file = document.getElementById('newImageFile').files[0];
      let img = '';
      if(file) img = await processImage(file);

      const tagsInput = document.getElementById('newTags').value;
      const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()) : [];

      const allergens = [];
      document.querySelectorAll('input[name="newAllergen"]:checked').forEach(cb => allergens.push(cb.value));

      await addDoc(collection(db, "menu"), {
        name,
        subtitle: document.getElementById('newSubtitle').value,
        price,
        category: document.getElementById('newCategory').value,
        badge: document.getElementById('newBadge').value,
        calories: document.getElementById('newCalories').value,
        description: document.getElementById('newDescription').value,
        descriptionEn: document.getElementById('newDescriptionEn').value,
        ingredients: document.getElementById('newIngredients').value,
        ingredientsEn: document.getElementById('newIngredientsEn').value,
        allergens,
        tags,
        image: img,
        isVisible: true
      });

      // تفريغ الحقول
      document.getElementById('newName').value = '';
      document.getElementById('newSubtitle').value = '';
      document.getElementById('newPrice').value = '';
      document.getElementById('newBadge').value = '';
      document.getElementById('newCalories').value = '';
      document.getElementById('newDescription').value = '';
      document.getElementById('newDescriptionEn').value = '';
      document.getElementById('newIngredients').value = '';
      document.getElementById('newIngredientsEn').value = '';
      document.getElementById('newTags').value = '';
      document.getElementById('newImageFile').value = '';
      document.querySelectorAll('input[name="newAllergen"]').forEach(cb => cb.checked = false);
      loadItems();
    };

    window.openEditModal = (id) => {
      window.currentEditId = id;
      const item = window.menuData[id];
      document.getElementById('editName').value = item.name || '';
      document.getElementById('editSubtitle').value = item.subtitle || '';
      document.getElementById('editPrice').value = item.price || '';
      document.getElementById('editBadge').value = item.badge || '';
      document.getElementById('editCalories').value = item.calories || '';
      document.getElementById('editDescription').value = item.description || '';
      document.getElementById('editDescriptionEn').value = item.descriptionEn || '';
      document.getElementById('editIngredients').value = item.ingredients || '';
      document.getElementById('editIngredientsEn').value = item.ingredientsEn || '';
      
      const itemAllergens = item.allergens || [];
      document.querySelectorAll('input[name="editAllergen"]').forEach(cb => {
        cb.checked = itemAllergens.includes(cb.value);
      });

      document.getElementById('editTags').value = item.tags ? item.tags.join(', ') : '';
      document.getElementById('editModal').classList.remove('hidden');
    };

    window.closeEditModal = () => document.getElementById('editModal').classList.add('hidden');

    window.saveEdit = async () => {
      if(!window.currentEditId) return;
      const file = document.getElementById('editImageFile').files[0];
      let img = window.menuData[window.currentEditId].image;
      if(file) img = await processImage(file);

      const tagsInput = document.getElementById('editTags').value;
      const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()) : [];

      const allergens = [];
      document.querySelectorAll('input[name="editAllergen"]:checked').forEach(cb => allergens.push(cb.value));

      await updateDoc(doc(db, "menu", window.currentEditId), {
        name: document.getElementById('editName').value,
        subtitle: document.getElementById('editSubtitle').value,
        price: document.getElementById('editPrice').value,
        badge: document.getElementById('editBadge').value,
        calories: document.getElementById('editCalories').value,
        description: document.getElementById('editDescription').value,
        descriptionEn: document.getElementById('editDescriptionEn').value,
        ingredients: document.getElementById('editIngredients').value,
        ingredientsEn: document.getElementById('editIngredientsEn').value,
        allergens,
        tags,
        image: img
      });

      closeEditModal();
      loadItems();
    };

    window.toggleVisibility = async (id, status) => {
      await updateDoc(doc(db, "menu", id), { isVisible: !status });
      loadItems();
    };

    window.deleteItem = async (id) => {
      if(confirm('متأكد من الحذف؟')) {
        await deleteDoc(doc(db, "menu", id));
        loadItems();
      }
    };
  </script>
</body>
</html>
