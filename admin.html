<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة مطعم لحمة وفحمة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>body { font-family: 'Cairo', sans-serif; background-color: #0f1218; color: white; }</style>
</head>
<body class="min-h-screen flex items-start md:items-center justify-center p-2 md:p-4 py-8">

  <!-- شاشة تسجيل الدخول -->
  <div id="loginScreen" class="w-full max-w-md bg-[#161a24] p-8 rounded-2xl border border-gray-800 shadow-2xl my-auto">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-black text-white">لوحة الإدارة</h1>
      <p class="text-sm text-gray-400 mt-1">مطعم لحمة وفحمة</p>
    </div>
    <div class="space-y-4">
      <div>
        <label class="block text-xs text-gray-400 mb-1">البريد الإلكتروني</label>
        <input type="email" id="email" class="w-full bg-[#0f1218] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500" placeholder="admin@lahma.com">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">كلمة المرور</label>
        <input type="password" id="password" class="w-full bg-[#0f1218] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500" placeholder="••••••••">
      </div>
      <button onclick="login()" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3 rounded-xl transition-all">
        تسجيل الدخول
      </button>
      <p id="errorMsg" class="text-red-500 text-xs text-center hidden"></p>
    </div>
  </div>

  <!-- لوحة التحكم الرئيسية (بدون ارتفاع ثابت لتناسب الجوال) -->
  <div id="dashboardScreen" class="w-full max-w-5xl bg-[#161a24] p-4 md:p-6 rounded-2xl border border-gray-800 shadow-2xl hidden flex-col gap-6">
    <div class="flex justify-between items-center pb-4 border-b border-gray-700 flex-wrap gap-4">
      <div class="flex items-center gap-4 flex-wrap">
        <h2 class="text-xl font-black text-white">إدارة قائمة الطعام</h2>
        <button type="button" onclick="autoTranslateNew()" class="bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white border border-blue-500/40 px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5">
          <i class="fa-solid fa-language"></i> ترجمة تلقائية 🌐
        </button>
      </div>
      <button onclick="logout()" class="bg-red-500/20 text-red-500 hover:bg-red-500 hover:text-white px-4 py-2 rounded-xl text-xs font-bold transition-all">تسجيل الخروج</button>
    </div>

    <!-- ميزة إدارة الأقسام -->
    <div class="bg-[#0f1218] p-4 rounded-xl border border-gray-800">
      <h3 class="text-sm font-bold text-white mb-3 text-orange-400"><i class="fa-solid fa-layer-group"></i> إدارة الأقسام (التصنيفات)</h3>
      <div class="flex flex-wrap gap-2 mb-2">
        <input type="text" id="catId" placeholder="المعرف (drinks)" class="w-full md:flex-1 bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
        <input type="text" id="catNameAr" placeholder="عربي (مشروبات)" class="w-full md:flex-1 bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
        <input type="text" id="catNameEn" placeholder="انجليزي (Drinks)" class="w-full md:flex-1 bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
        <div class="flex w-full md:w-auto gap-2">
          <input type="text" id="catEmoji" placeholder="إيموجي 🥤" class="w-20 bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white text-center">
          <button onclick="addCategory()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg text-sm transition-all">إضافة</button>
        </div>
      </div>
      <div id="categoriesList" class="flex flex-wrap gap-2 mt-3"></div>
    </div>

    <!-- فورم إضافة وجبة -->
    <div class="bg-[#0f1218] p-4 md:p-5 rounded-xl border border-gray-800 grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
      <div><label class="block text-[10px] text-gray-400 mb-1">اسم الوجبة (عربي) *</label><input type="text" id="newName" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
      <div><label class="block text-[10px] text-gray-400 mb-1">الاسم الإنجليزي (Subtitle)</label><input type="text" id="newSubtitle" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
      <div><label class="block text-[10px] text-gray-400 mb-1">السعر *</label><input type="text" id="newPrice" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
      <div><label class="block text-[10px] text-gray-400 mb-1">القسم</label><select id="newCategory" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"><option value="">جاري التحميل...</option></select></div>
      <div><label class="block text-[10px] text-gray-400 mb-1">الشعار (Badge عربي)</label><input type="text" id="newBadge" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
      <div><label class="block text-[10px] text-gray-400 mb-1">الشعار (Badge EN)</label><input type="text" id="newBadgeEn" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
      <div><label class="block text-[10px] text-gray-400 mb-1">السعرات</label><input type="text" id="newCalories" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
      <div class="md:col-span-2"><label class="block text-[10px] text-gray-400 mb-1">الوصف (عربي)</label><input type="text" id="newDescription" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
      <div><label class="block text-[10px] text-gray-400 mb-1">الوصف بالإنجليزية</label><input type="text" id="newDescriptionEn" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
      <div class="md:col-span-2"><label class="block text-[10px] text-gray-400 mb-1">المكونات (عربي)</label><input type="text" id="newIngredients" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
      <div><label class="block text-[10px] text-gray-400 mb-1">المكونات بالإنجليزية</label><input type="text" id="newIngredientsEn" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
      <div class="md:col-span-2"><label class="block text-[10px] text-gray-400 mb-1">الوسوم (مفصولة بفاصلة ,)</label><input type="text" id="newTags" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
      <div><label class="block text-[10px] text-gray-400 mb-1">الوسوم بالإنجليزية</label><input type="text" id="newTagsEn" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
      
      <div class="md:col-span-3 bg-[#161a24] p-3 rounded-lg border border-gray-800">
        <label class="block text-xs text-orange-400 font-bold mb-2">مسببات الحساسية:</label>
        <div class="flex flex-wrap gap-4 text-xs text-gray-300">
          <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="newAllergen" value="البيض 🥚" class="accent-orange-600"> البيض 🥚</label>
          <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="newAllergen" value="الألبان 🥛" class="accent-orange-600"> الألبان 🥛</label>
          <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="newAllergen" value="الغلوتين 🌾" class="accent-orange-600"> الغلوتين (خبز) 🌾</label>
          <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="newAllergen" value="السمسم 🫘" class="accent-orange-600"> السمسم 🫘</label>
          <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="newAllergen" value="المكسرات 🥜" class="accent-orange-600"> المكسرات 🥜</label>
        </div>
      </div>

      <div class="md:col-span-3"><label class="block text-[10px] text-gray-400 mb-1">صورة الوجبة</label><input type="file" id="newImageFile" accept="image/*" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white"></div>
      <div class="md:col-span-3 flex justify-end mt-2"><button id="submitBtn" onclick="addItem()" class="w-full md:w-auto bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 md:py-2 px-8 rounded-lg text-sm transition-all shadow-lg">إضافة الوجبة</button></div>
    </div>

    <!-- الزر السحري (مخفي مؤقتاً لتخفيف الزحمة، يمكنك مسح التعليق عنه إذا احتجته) -->
    <!-- <div class="mb-2">
      <button onclick="injectAllOldData()" id="magicBtn" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-black py-4 rounded-xl transition-all shadow-[0_0_15px_rgba(147,51,234,0.3)] border border-purple-400/50 flex items-center justify-center gap-2 text-lg">
        <i class="fa-solid fa-wand-magic-sparkles"></i> استعادة الـ 15 وجبة الأصلية
      </button>
    </div> -->

    <!-- جدول الوجبات (مجهز للجوال بتمرير أفقي) -->
    <div class="w-full overflow-x-auto rounded-xl border border-gray-800 bg-[#0f1218]">
      <table class="w-full text-right text-sm min-w-[700px]">
        <thead class="bg-[#161a24] text-gray-400 text-xs uppercase border-b border-gray-700">
          <tr>
            <th class="px-4 py-4">الوجبة</th>
            <th class="px-4 py-4">القسم</th>
            <th class="px-4 py-4">السعر</th>
            <th class="px-4 py-4 text-center">الحالة</th>
            <th class="px-4 py-4 text-left">إجراءات وترتيب</th>
          </tr>
        </thead>
        <tbody id="menuTable" class="divide-y divide-gray-800">
        </tbody>
      </table>
    </div>
  </div>

  <!-- نافذة التعديل -->
  <div id="editModal" class="fixed inset-0 bg-black/85 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-[#161a24] border border-gray-700 rounded-2xl w-full max-w-xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-3">
        <h3 class="text-xl font-bold text-white">تعديل الوجبة</h3>
        <button type="button" onclick="autoTranslateEdit()" class="bg-blue-600/20 hover:bg-blue-600 text-blue-400 hover:text-white border border-blue-500/40 px-3 py-1 rounded-lg text-xs font-bold transition-all">ترجمة 🌐</button>
      </div>
      <div class="space-y-3">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div><label class="block text-xs text-gray-400 mb-1">اسم الوجبة (عربي)</label><input type="text" id="editName" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
          <div><label class="block text-xs text-gray-400 mb-1">الاسم الإنجليزي</label><input type="text" id="editSubtitle" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div><label class="block text-xs text-gray-400 mb-1">السعر</label><input type="text" id="editPrice" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
          <div><label class="block text-xs text-gray-400 mb-1">القسم</label><select id="editCategory" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></select></div>
          <div><label class="block text-xs text-gray-400 mb-1">الشعار عربي</label><input type="text" id="editBadge" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
          <div><label class="block text-xs text-gray-400 mb-1">الشعار EN</label><input type="text" id="editBadgeEn" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div><label class="block text-xs text-gray-400 mb-1">الوصف (عربي)</label><input type="text" id="editDescription" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
          <div><label class="block text-xs text-gray-400 mb-1">الوصف (EN)</label><input type="text" id="editDescriptionEn" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
          <div><label class="block text-xs text-gray-400 mb-1">المكونات (عربي)</label><input type="text" id="editIngredients" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
          <div><label class="block text-xs text-gray-400 mb-1">المكونات (EN)</label><input type="text" id="editIngredientsEn" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
          <div><label class="block text-xs text-gray-400 mb-1">الوسوم</label><input type="text" id="editTags" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
          <div><label class="block text-xs text-gray-400 mb-1">الوسوم (EN)</label><input type="text" id="editTagsEn" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white"></div>
        </div>
        
        <div class="bg-[#0f1218] p-3 rounded-lg border border-gray-800">
          <label class="block text-xs text-orange-400 font-bold mb-2">مسببات الحساسية:</label>
          <div class="flex flex-wrap gap-3 text-xs text-gray-300">
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="editAllergen" value="البيض 🥚" class="accent-orange-600"> البيض</label>
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="editAllergen" value="الألبان 🥛" class="accent-orange-600"> الألبان</label>
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="editAllergen" value="الغلوتين 🌾" class="accent-orange-600"> الغلوتين</label>
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="editAllergen" value="السمسم 🫘" class="accent-orange-600"> السمسم</label>
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" name="editAllergen" value="المكسرات 🥜" class="accent-orange-600"> المكسرات</label>
          </div>
        </div>
        <div><label class="block text-xs text-gray-400 mb-1">تغيير الصورة</label><input type="file" id="editImageFile" accept="image/*" class="w-full bg-[#0f1218] border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white"></div>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <button onclick="closeEditModal()" class="px-4 py-2 rounded-lg text-sm text-gray-400 hover:bg-gray-800">إلغاء</button>
        <button id="saveEditBtn" onclick="saveEdit()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-lg text-sm font-bold">حفظ</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcR06wtdVs0nI3Gmi0Keb8Q9EdXTOEgf0",
      authDomain: "lahma-menu.firebaseapp.com",
      projectId: "lahma-menu",
      storageBucket: "lahma-menu.firebasestorage.app",
      messagingSenderId: "642565994237",
      appId: "1:642565994237:web:2fff0a3fe0741460f67094"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.menuData = {};
    window.menuList = [];
    window.categoriesMap = {};
    window.currentEditId = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('hidden');
        document.getElementById('dashboardScreen').classList.add('flex');
        loadCategories();
      } else {
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('dashboardScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('flex');
      }
    });

    window.login = () => {
      const e = document.getElementById('email').value;
      const p = document.getElementById('password').value;
      signInWithEmailAndPassword(auth, e, p).catch(() => {
        document.getElementById('errorMsg').textContent = 'تأكد من البيانات';
        document.getElementById('errorMsg').classList.remove('hidden');
      });
    };

    window.logout = () => signOut(auth);

    async function loadCategories() {
      const snapshot = await getDocs(collection(db, "categories"));
      const newSelect = document.getElementById('newCategory');
      const editSelect = document.getElementById('editCategory');
      const list = document.getElementById('categoriesList');
      
      newSelect.innerHTML = '<option value="">اختر القسم...</option>';
      editSelect.innerHTML = '<option value="">اختر القسم...</option>';
      list.innerHTML = '';
      window.categoriesMap = {};

      snapshot.forEach(docSnap => {
        const cat = docSnap.data();
        const displayName = `${cat.emoji || ''} ${cat.nameAr}`;
        window.categoriesMap[cat.id] = displayName;
        
        const optionHtml = `<option value="${cat.id}">${displayName}</option>`;
        newSelect.innerHTML += optionHtml;
        editSelect.innerHTML += optionHtml;

        list.innerHTML += `<div class="bg-[#1a1f2b] border border-gray-700 text-xs px-3 py-1.5 rounded-lg flex items-center gap-3"><span class="font-bold text-gray-300">${displayName}</span><button onclick="deleteCategory('${docSnap.id}')" class="text-red-500 hover:text-red-400"><i class="fa-solid fa-xmark"></i></button></div>`;
      });
      loadItems();
    }

    window.loadItems = async () => {
      const table = document.getElementById('menuTable');
      table.innerHTML = '<tr><td colspan="5" class="text-center py-6 text-gray-500">جاري التحميل...</td></tr>';
      
      const snapshot = await getDocs(collection(db, "menu"));
      window.menuData = {};
      window.menuList = [];
      
      snapshot.forEach(docSnap => {
        let data = docSnap.data();
        data.id = docSnap.id;
        if(typeof data.order !== 'number') data.order = 999999;
        window.menuList.push(data);
      });

      window.menuList.sort((a, b) => a.order - b.order);

      window.menuList.forEach((item, index) => {
         const correctOrder = index * 10;
         if(item.order !== correctOrder) {
            item.order = correctOrder;
            updateDoc(doc(db, "menu", item.id), { order: correctOrder }).catch(console.error);
         }
         window.menuData[item.id] = item;
      });

      renderTableLocally();
    };

    window.renderTableLocally = () => {
      const table = document.getElementById('menuTable');
      table.innerHTML = '';
      
      if(window.menuList.length === 0) {
        table.innerHTML = '<tr><td colspan="5" class="text-center py-6 text-gray-500">القائمة فارغة</td></tr>';
        return;
      }

      window.menuList.forEach((item, index) => {
        const isVisible = item.isVisible !== false;
        const categoryName = window.categoriesMap[item.category] || item.category || 'غير محدد';
        
        table.innerHTML += `
          <tr class="hover:bg-[#1f2430] ${!isVisible ? 'opacity-50' : ''}">
            <td class="px-4 py-3 font-bold text-white">${item.name}</td>
            <td class="px-4 py-3 text-xs text-gray-400">${categoryName}</td>
            <td class="px-4 py-3 text-orange-500 font-bold whitespace-nowrap">${item.price} ل.س</td>
            <td class="px-4 py-3 text-center">
              <button onclick="toggleVisibility('${item.id}', ${isVisible})" class="px-2 py-1 rounded text-xs ${isVisible ? 'bg-green-500/20 text-green-400' : 'bg-gray-700 text-gray-300'}">
                ${isVisible ? '👁 ظاهر' : '❌ مخفي'}
              </button>
            </td>
            <td class="px-4 py-3 text-left">
              <div class="flex items-center justify-end gap-1.5 w-full">
                <button onclick="moveItem(${index}, 'up')" class="text-gray-400 bg-[#161a24] hover:text-white px-2 py-1.5 rounded disabled:opacity-30 border border-gray-700" ${index === 0 ? 'disabled' : ''}><i class="fa-solid fa-arrow-up"></i></button>
                <button onclick="moveItem(${index}, 'down')" class="text-gray-400 bg-[#161a24] hover:text-white px-2 py-1.5 rounded disabled:opacity-30 border border-gray-700" ${index === window.menuList.length - 1 ? 'disabled' : ''}><i class="fa-solid fa-arrow-down"></i></button>
                <div class="w-px h-5 bg-gray-700 mx-1"></div>
                <button onclick="openEditModal('${item.id}')" class="text-blue-400 text-xs border border-blue-500/30 px-3 py-1.5 rounded hover:bg-blue-500/10 whitespace-nowrap">تعديل</button>
                <button onclick="deleteItem('${item.id}')" class="text-red-400 text-xs border border-red-500/30 px-3 py-1.5 rounded hover:bg-red-500/10 whitespace-nowrap">حذف</button>
              </div>
            </td>
          </tr>
        `;
      });
    };

    window.moveItem = async (index, direction) => {
      const items = window.menuList;
      if (direction === 'up' && index > 0) {
        let temp = items[index];
        items[index] = items[index - 1];
        items[index - 1] = temp;
      } else if (direction === 'down' && index < items.length - 1) {
        let temp = items[index];
        items[index] = items[index + 1];
        items[index + 1] = temp;
      } else return;

      for(let i = 0; i < items.length; i++) {
        items[i].order = i * 10;
        updateDoc(doc(db, "menu", items[i].id), { order: items[i].order }).catch(console.error);
      }
      renderTableLocally();
    };

    window.addItem = async () => {
      const name = document.getElementById('newName').value;
      const price = document.getElementById('newPrice').value;
      if(!name || !price) return alert('الاسم والسعر مطلوبان!');
      
      const btn = document.getElementById('submitBtn');
      const oTxt = btn.innerText;
      btn.innerText = 'جاري الإضافة...';
      btn.disabled = true;

      try {
        const newOrder = window.menuList.length * 10;
        const tags = document.getElementById('newTags').value.split(',').map(t => t.trim()).filter(Boolean);
        const tagsEn = document.getElementById('newTagsEn').value.split(',').map(t => t.trim()).filter(Boolean);
        const allergens = [];
        document.querySelectorAll('input[name="newAllergen"]:checked').forEach(cb => allergens.push(cb.value));

        let img = '';
        const file = document.getElementById('newImageFile').files[0];
        if(file) img = await processImage(file);

        await addDoc(collection(db, "menu"), {
          name, subtitle: document.getElementById('newSubtitle').value, price,
          category: document.getElementById('newCategory').value, badge: document.getElementById('newBadge').value,
          badgeEn: document.getElementById('newBadgeEn').value, description: document.getElementById('newDescription').value,
          descriptionEn: document.getElementById('newDescriptionEn').value, ingredients: document.getElementById('newIngredients').value,
          ingredientsEn: document.getElementById('newIngredientsEn').value, allergens, tags, tagsEn, image: img, isVisible: true,
          order: newOrder
        });
        
        // مسح الفورم
        document.querySelectorAll('#newName, #newSubtitle, #newPrice, #newBadge, #newBadgeEn, #newCalories, #newDescription, #newDescriptionEn, #newIngredients, #newIngredientsEn, #newTags, #newTagsEn, #newImageFile').forEach(el => el.value = '');
        document.querySelectorAll('input[name="newAllergen"]').forEach(cb => cb.checked = false);
        loadItems();
      } catch (e) { alert("حدث خطأ"); } finally { btn.innerText = oTxt; btn.disabled = false; }
    };

    window.openEditModal = (id) => {
      try {
        window.currentEditId = id;
        const item = window.menuData[id];
        
        document.getElementById('editName').value = item.name || '';
        document.getElementById('editSubtitle').value = item.subtitle || '';
        document.getElementById('editPrice').value = item.price || '';
        document.getElementById('editCategory').value = item.category || '';
        document.getElementById('editBadge').value = item.badge || '';
        document.getElementById('editBadgeEn').value = item.badgeEn || '';
        document.getElementById('editDescription').value = item.description || '';
        document.getElementById('editDescriptionEn').value = item.descriptionEn || '';
        document.getElementById('editIngredients').value = item.ingredients || '';
        document.getElementById('editIngredientsEn').value = item.ingredientsEn || '';
        
        const tags = Array.isArray(item.tags) ? item.tags.join(', ') : (item.tags || '');
        document.getElementById('editTags').value = tags;
        const tagsEn = Array.isArray(item.tagsEn) ? item.tagsEn.join(', ') : (item.tagsEn || '');
        document.getElementById('editTagsEn').value = tagsEn;
        
        const itemAllergens = item.allergens || [];
        document.querySelectorAll('input[name="editAllergen"]').forEach(cb => { cb.checked = itemAllergens.includes(cb.value); });
        
        document.getElementById('editModal').classList.remove('hidden');
      } catch (e) { alert('خطأ في التعديل: ' + e.message); }
    };

    window.closeEditModal = () => document.getElementById('editModal').classList.add('hidden');

    window.saveEdit = async () => {
      if(!window.currentEditId) return;
      const btn = document.getElementById('saveEditBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = 'جاري الحفظ...';
      btn.disabled = true;

      try {
        const file = document.getElementById('editImageFile').files[0];
        let img = window.menuData[window.currentEditId].image;
        if(file) img = await processImage(file);

        const tags = document.getElementById('editTags').value ? document.getElementById('editTags').value.split(',').map(t => t.trim()) : [];
        const tagsEn = document.getElementById('editTagsEn').value ? document.getElementById('editTagsEn').value.split(',').map(t => t.trim()) : [];
        const allergens = [];
        document.querySelectorAll('input[name="editAllergen"]:checked').forEach(cb => allergens.push(cb.value));

        await updateDoc(doc(db, "menu", window.currentEditId), {
          name: document.getElementById('editName').value, subtitle: document.getElementById('editSubtitle').value,
          price: document.getElementById('editPrice').value, category: document.getElementById('editCategory').value,
          badge: document.getElementById('editBadge').value, badgeEn: document.getElementById('editBadgeEn').value,
          description: document.getElementById('editDescription').value, descriptionEn: document.getElementById('editDescriptionEn').value,
          ingredients: document.getElementById('editIngredients').value, ingredientsEn: document.getElementById('editIngredientsEn').value,
          allergens, tags, tagsEn, image: img
        });
        closeEditModal();
        loadItems();
      } catch (error) { alert('❌ حدث خطأ.'); } 
      finally { btn.innerHTML = originalText; btn.disabled = false; }
    };

    window.toggleVisibility = async (id, status) => { await updateDoc(doc(db, "menu", id), { isVisible: !status }); loadItems(); };
    window.deleteItem = async (id) => { if(confirm('متأكد من الحذف؟')) { await deleteDoc(doc(db, "menu", id)); loadItems(); } };

    window.addCategory = async () => {
      const id = document.getElementById('catId').value;
      const nameAr = document.getElementById('catNameAr').value;
      const nameEn = document.getElementById('catNameEn').value;
      const emoji = document.getElementById('catEmoji').value;
      if(!id || !nameAr) return alert('المعرف والاسم العربي مطلوبان!');
      await addDoc(collection(db, "categories"), { id, nameAr, nameEn, emoji });
      document.getElementById('catId').value = ''; document.getElementById('catNameAr').value = '';
      document.getElementById('catNameEn').value = ''; document.getElementById('catEmoji').value = '';
      loadCategories();
    };

    window.deleteCategory = async (docId) => { if(confirm('هل أنت متأكد من حذف القسم؟')) { await deleteDoc(doc(db, "categories", docId)); loadCategories(); } };

    // دالة مساعدة للترجمة التلقائية
    async function translateText(text) {
      if (!text) return '';
      try { const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ar|en`);
      const data = await res.json(); return data?.responseData?.translatedText || text; } catch (e) { return text; }
    }
    window.autoTranslateNew = async function() {
      const b = event.target; b.innerHTML = 'جاري الترجمة... ⏳';
      const n = document.getElementById('newName').value, ba = document.getElementById('newBadge').value;
      const d = document.getElementById('newDescription').value, i = document.getElementById('newIngredients').value, t = document.getElementById('newTags').value;
      if(n) document.getElementById('newSubtitle').value = await translateText(n);
      if(ba) document.getElementById('newBadgeEn').value = await translateText(ba);
      if(d) document.getElementById('newDescriptionEn').value = await translateText(d);
      if(i) document.getElementById('newIngredientsEn').value = await translateText(i);
      if(t) document.getElementById('newTagsEn').value = await translateText(t);
      b.innerHTML = '<i class="fa-solid fa-language"></i> ترجمة تلقائية 🌐';
    };
    window.autoTranslateEdit = async function() {
      const b = event.target; b.innerHTML = 'جاري الترجمة...';
      const n = document.getElementById('editName').value, ba = document.getElementById('editBadge').value;
      const d = document.getElementById('editDescription').value, i = document.getElementById('editIngredients').value, t = document.getElementById('editTags').value;
      if(n) document.getElementById('editSubtitle').value = await translateText(n);
      if(ba) document.getElementById('editBadgeEn').value = await translateText(ba);
      if(d) document.getElementById('editDescriptionEn').value = await translateText(d);
      if(i) document.getElementById('editIngredientsEn').value = await translateText(i);
      if(t) document.getElementById('editTagsEn').value = await translateText(t);
      b.innerHTML = 'ترجمة 🌐';
    };

    function processImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader(); reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image(); img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas'); let w = img.width, h = img.height;
            if (w > h && w > 400) { h *= 400 / w; w = 400; } else if (h > 400) { w *= 400 / h; h = 400; }
            canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
        };
      });
    }
  </script>
</body>
</html>
