<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة مطعم لحمة وفحمة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>body { font-family: 'Cairo', sans-serif; background-color: #0f1218; color: white; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- شاشة تسجيل الدخول -->
  <div id="loginScreen" class="w-full max-w-md bg-[#161a24] p-8 rounded-2xl border border-gray-800 shadow-2xl">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-black text-white">لوحة الإدارة</h1>
      <p class="text-sm text-gray-400 mt-1">مطعم لحمة وفحمة</p>
    </div>
    <div class="space-y-4">
      <div>
        <label class="block text-xs text-gray-400 mb-1">البريد الإلكتروني</label>
        <input type="email" id="email" class="w-full bg-[#0f1218] border border-gray-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-orange-500" placeholder="admin@lahma.com">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">كلمة المرور</label>
        <input type="password" id="password" class="w-full bg-[#0f1218] border border-gray-700 rounded-xl px-4 py-2 text-white focus:outline-none focus:border-orange-500" placeholder="••••••••">
      </div>
      <button onclick="login()" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-2.5 rounded-xl transition-all">
        تسجيل الدخول
      </button>
      <p id="errorMsg" class="text-red-500 text-xs text-center hidden"></p>
    </div>
  </div>

  <!-- لوحة التحكم -->
  <div id="dashboardScreen" class="w-full max-w-5xl bg-[#161a24] p-6 rounded-2xl border border-gray-800 shadow-2xl hidden h-[95vh] flex flex-col">
    <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-700">
      <h2 class="text-xl font-black text-white">إدارة قائمة الطعام (المنيو) الاحترافية</h2>
      <button onclick="logout()" class="bg-red-500/20 text-red-500 hover:bg-red-500 hover:text-white px-4 py-2 rounded-xl text-xs font-bold transition-all">تسجيل الخروج</button>
    </div>

    <!-- فورم إضافة وجبة -->
    <div class="bg-[#0f1218] p-5 rounded-xl border border-gray-800 mb-6 grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
      <div>
        <label class="block text-[10px] text-gray-400 mb-1">اسم الوجبة *</label>
        <input type="text" id="newName" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="مثال: برجر دجاج">
      </div>
      <div>
        <label class="block text-[10px] text-gray-400 mb-1">السعر *</label>
        <input type="text" id="newPrice" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="مثال: 25000">
      </div>
      <div>
        <label class="block text-[10px] text-gray-400 mb-1">القسم *</label>
        <select id="newCategory" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white">
          <option value="sandwich">سندويش</option>
          <option value="burger">برجر</option>
          <option value="drinks">مشروبات</option>
        </select>
      </div>
      <div class="md:col-span-2">
        <label class="block text-[10px] text-gray-400 mb-1">المكونات (الوصف)</label>
        <input type="text" id="newIngredients" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-2 text-sm text-white" placeholder="مثال: دجاج مقرمش، صوص ثوم، مخلل">
      </div>
      <div>
        <label class="block text-[10px] text-gray-400 mb-1">صورة الوجبة (اختياري)</label>
        <input type="file" id="newImageFile" accept="image/*" class="w-full bg-[#161a24] border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white file:mr-4 file:py-1 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-orange-600 file:text-white hover:file:bg-orange-500 cursor-pointer">
      </div>
      <div class="md:col-span-3 flex justify-end mt-2">
        <button id="submitBtn" onclick="addItem()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-8 rounded-lg text-sm transition-all shadow-lg shadow-emerald-900/50">
          إضافة الوجبة للقائمة
        </button>
      </div>
    </div>

    <!-- جدول الوجبات -->
    <div class="flex-1 overflow-auto rounded-xl border border-gray-800">
      <table class="w-full text-right text-sm">
        <thead class="bg-[#0f1218] text-gray-400 text-xs uppercase sticky top-0 z-10 shadow-md">
          <tr>
            <th class="px-4 py-4">الوجبة</th>
            <th class="px-4 py-4">القسم</th>
            <th class="px-4 py-4">السعر</th>
            <th class="px-4 py-4 text-center">الحالة (إظهار/إخفاء)</th>
            <th class="px-4 py-4 text-left">إجراءات</th>
          </tr>
        </thead>
        <tbody id="menuTable" class="divide-y divide-gray-800">
        </tbody>
      </table>
    </div>
  </div>

  <!-- أكواد فايربيس -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcR06wtdVs0nI3Gmi0Keb8Q9EdXTOEgf0",
      authDomain: "lahma-menu.firebaseapp.com",
      projectId: "lahma-menu",
      storageBucket: "lahma-menu.firebasestorage.app",
      messagingSenderId: "642565994237",
      appId: "1:642565994237:web:2fff0a3fe0741460f67094",
      measurementId: "G-MZ4G6DD20L"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginScreen = document.getElementById('loginScreen');
    const dashboardScreen = document.getElementById('dashboardScreen');

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginScreen.classList.add('hidden');
        dashboardScreen.classList.remove('hidden');
        loadItems();
      } else {
        loginScreen.classList.remove('hidden');
        dashboardScreen.classList.add('hidden');
      }
    });

    window.login = () => {
      const e = document.getElementById('email').value;
      const p = document.getElementById('password').value;
      const msg = document.getElementById('errorMsg');
      
      signInWithEmailAndPassword(auth, e, p).catch(err => {
        msg.textContent = "تأكد من الإيميل وكلمة المرور!";
        msg.classList.remove('hidden');
      });
    };

    window.logout = () => signOut(auth);

    async function loadItems() {
      const table = document.getElementById('menuTable');
      table.innerHTML = '<tr class="text-center"><td colspan="5" class="py-8 text-gray-500">جاري التحميل...</td></tr>';
      
      const querySnapshot = await getDocs(collection(db, "menu"));
      table.innerHTML = '';
      
      if(querySnapshot.empty) {
        table.innerHTML = '<tr class="text-center"><td colspan="5" class="py-8 text-gray-500">القائمة فارغة حالياً. ابدأ بإضافة وجبات!</td></tr>';
        return;
      }

      querySnapshot.forEach((docSnap) => {
        const item = docSnap.data();
        const id = docSnap.id;
        const isVisible = item.isVisible !== false; 
        
        const imgUrl = item.image || 'https://via.placeholder.com/150?text=No+Image';

        table.innerHTML += `
          <tr class="hover:bg-[#1a1f2b] transition-colors ${!isVisible ? 'opacity-50' : ''}">
            <td class="px-4 py-3">
              <div class="flex items-center gap-3">
                <img src="${imgUrl}" class="w-12 h-12 rounded-lg object-cover border border-gray-700">
                <div>
                  <div class="font-bold text-white text-base">${item.name}</div>
                  <div class="text-xs text-gray-400 mt-1 max-w-[200px] truncate" title="${item.ingredients || 'لا يوجد وصف'}">${item.ingredients || 'لا يوجد وصف'}</div>
                </div>
              </div>
            </td>
            <td class="px-4 py-3 text-gray-400 text-xs">${item.category === 'sandwich' ? 'سندويش' : item.category === 'drinks' ? 'مشروبات' : 'برجر'}</td>
            <td class="px-4 py-3 text-orange-500 font-black">${item.price}</td>
            <td class="px-4 py-3 text-center">
              <button onclick="toggleVisibility('${id}', ${isVisible})" class="px-3 py-1 rounded-md text-xs font-bold transition-all ${isVisible ? 'bg-green-500/20 text-green-500 hover:bg-green-500 hover:text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}">
                ${isVisible ? '👁️ ظاهر' : '❌ مخفي'}
              </button>
            </td>
            <td class="px-4 py-3 text-left">
              <button onclick="deleteItem('${id}')" class="text-red-500 hover:text-red-400 text-xs font-bold border border-red-500/30 px-3 py-1.5 rounded-md hover:bg-red-500/10">🗑️ حذف</button>
            </td>
          </tr>
        `;
      });
    }

    // خدعة ضغط الصورة وتحويلها لنص (Base64) لكي نحفظها في قاعدة البيانات مجاناً
    function processImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            const MAX_SIZE = 400; // تصغير الصورة لتناسب قاعدة البيانات

            if (width > height && width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            } else if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            // تحويل الصورة لنص مع ضغطها جودتها لـ 70%
            resolve(canvas.toDataURL('image/jpeg', 0.7)); 
          };
        };
        reader.onerror = error => reject(error);
      });
    }

    window.addItem = async () => {
      const name = document.getElementById('newName').value;
      const price = document.getElementById('newPrice').value;
      const category = document.getElementById('newCategory').value;
      const ingredients = document.getElementById('newIngredients').value;
      const imageFile = document.getElementById('newImageFile').files[0];
      const submitBtn = document.getElementById('submitBtn');

      if(!name || !price) return alert('يرجى كتابة اسم الوجبة والسعر على الأقل!');

      try {
        submitBtn.textContent = 'جاري الإضافة ⏳...';
        submitBtn.disabled = true;
        submitBtn.classList.replace('bg-emerald-600', 'bg-gray-500');

        let base64Image = '';
        
        // إذا اختار صورة، نضغطها ونحولها لنص
        if (imageFile) {
          base64Image = await processImage(imageFile);
        }

        await addDoc(collection(db, "menu"), {
          name: name,
          price: price, // السعر يمكنك كتابته بالمئات الآن مثلا 250
          category: category,
          ingredients: ingredients,
          image: base64Image, // نحفظ الصورة كنص داخل قاعدة البيانات مباشرة!
          isVisible: true 
        });
        
        document.getElementById('newName').value = '';
        document.getElementById('newPrice').value = '';
        document.getElementById('newIngredients').value = '';
        document.getElementById('newImageFile').value = '';
        
        submitBtn.textContent = 'إضافة الوجبة للقائمة';
        submitBtn.disabled = false;
        submitBtn.classList.replace('bg-gray-500', 'bg-emerald-600');

        loadItems();
      } catch (e) {
        console.error(e);
        alert("حدث خطأ أثناء الإضافة.");
        submitBtn.textContent = 'إضافة الوجبة للقائمة';
        submitBtn.disabled = false;
        submitBtn.classList.replace('bg-gray-500', 'bg-emerald-600');
      }
    };

    window.toggleVisibility = async (id, currentStatus) => {
      try {
        const itemRef = doc(db, "menu", id);
        await updateDoc(itemRef, {
          isVisible: !currentStatus
        });
        loadItems();
      } catch (error) {
        alert("حدث خطأ أثناء تغيير الحالة");
      }
    };

    window.deleteItem = async (id) => {
      if(confirm('هل أنت متأكد من حذف هذه الوجبة نهائياً؟')) {
        await deleteDoc(doc(db, "menu", id));
        loadItems();
      }
    };
  </script>
</body>
</html>
