<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو - لحمة وفحمة</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .header {
            text-align: center;
            padding: 20px;
            background-color: #1f1f1f;
            border-bottom: 3px solid #ff5722;
        }
        .header h1 {
            margin: 0;
            color: #ff5722;
        }
        .header p {
            margin: 5px 0 0;
            font-size: 14px;
            color: #aaaaaa;
        }
        .categories {
            display: flex;
            overflow-x: auto;
            padding: 15px;
            gap: 10px;
        }
        .category-btn {
            background-color: #333;
            color: #fff;
            border: 1px solid #ff5722;
            padding: 8px 15px;
            border-radius: 20px;
            white-space: nowrap;
            cursor: pointer;
        }
        .category-btn.active {
            background-color: #ff5722;
        }
        .menu-items {
            padding: 15px;
        }
        .item-card {
            background-color: #1f1f1f;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-details h3 {
            margin: 0 0 5px;
            color: #ff5722;
        }
        .item-details p {
            margin: 0;
            font-size: 12px;
            color: #ccc;
        }
        .item-price {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>لحمة وفحمة</h1>
        <p>اللاذقية - شارع بور | 0933473788</p>
    </div>

    <div class="categories">
        <div class="category-btn active">الكل</div>
        <div class="category-btn">سندويش</div>
        <div class="category-btn">وجبات</div>
        <div class="category-btn">مشروبات</div>
    </div>

    <div class="menu-items">
        <!-- وجبة تجريبية -->
        <div class="item-card">
            <div class="item-details">
                <h3>سندويشة لحمة وفحمة</h3>
                <p>لحم طازج مشوي على الفحم مع الصوص الخاص</p>
            </div>
            <div class="item-price">35,000 ل.س</div>
        </div>

        <div class="item-card">
            <div class="item-details">
                <h3>وجبة عربي</h3>
                <p>قطع شاورما أو لحم مع بطاطا ومخلل</p>
            </div>
            <div class="item-price">60,000 ل.س</div>
        </div>
    </div>

</body>
</html>
